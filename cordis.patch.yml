# dsh-model-capability-detector 的 bundle 补丁。
#
# 行 id 与包名一致，安装后可在 profile 自己的 cordis.patch.yml 中按 id 定位并调参。
- insert:
    - id: dsh-model-capability-detector
      name: "dsh-model-capability-detector"
      config:
        settingsNs: llm-pi-ai
        enabled: true
        overwrite: false
        dryRun: false
        timeoutMs: 15000
        catalogFallback: true
        catalogNumbers: true
        catalogNumericStrategy: minimum
        discoveryTrigger: true
        logging: false
        logFile: ""
